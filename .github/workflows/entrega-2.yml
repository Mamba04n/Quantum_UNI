name: Entrega final académica
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: quantum_uni_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: dom, curl, mbstring, zip, pdo_mysql, gd
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.testing.example .env.testing
      - run: php artisan test --filter='AcademicInstallationTest|AcademicDeliveryEvidenceTest|DirectInventorySaleTest|DispatchAuthorizationManagerTest|KardexViewerTest|PurchasePreparationApprovedOfferTest|CustomerResourceIdorTest|LoginRateLimitTest|DashboardMetricsTest|WorkspaceNavigationTest|test_openapi_document_covers_every_public_finance_path|StandalonePhpScriptGuardTest'
